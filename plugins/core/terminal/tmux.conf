# The terminal's own tmux server (tmux -L vaultite): it only keeps shells alive across server restarts, so it stays
# out of sight. No prefix, no status line, no mouse (xterm.js selects natively; the page's wheel and swipes scroll through
# the server: plugin.ts, scroll), and it draws in the normal buffer, not the alternate one.
set -g prefix None
unbind -a
set -g status off
set -g mouse off
set -s escape-time 0
set -g focus-events on
set -g set-titles off
set -g allow-rename off
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"
set -as terminal-features ",xterm*:RGB"
# Programs copying (Claude Code's "copied to clipboard": OSC 52) reach the page, which puts it on the clipboard.
set -g set-clipboard on
set -as terminal-features ",xterm*:clipboard"
set -g window-size latest
set -g exit-empty on
