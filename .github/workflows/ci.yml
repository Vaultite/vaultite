# Every push to main and pull request: build, check and the tests on Linux, macOS and Windows (windows.yml: Arm and the
# app itself), and the web demo. Nightly: every UI QA script too, so they don't rot (`-f scripts="a b"`: only those).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scripts:
        description: QA scripts to run (all when empty)
        required: false
  schedule:
    - cron: "0 5 * * *"
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # First: the rules most pushes break, in seconds
      - run: npm run check
      # Playwright's Chromium, cached by its version, so its CDN being down fails nothing (each step after check runs
      # whatever check said, so one push shows every failure)
      - if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - if: ${{ !cancelled() }}
        run: npx playwright-core install --with-deps chromium
      - if: ${{ !cancelled() }}
        run: npm run build
      - if: ${{ !cancelled() }}
        run: npm test
      - if: ${{ !cancelled() }}
        run: npm run smoke
  # The web demo as the site builds it (Vaultite's own plugins at their main), in Chrome and WebKit: a demo that can't
  # start is caught on the push that broke it, not at a release.
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # (no desktop app here)
    # (the plugins beside the app, as vaultite/ and vaultite-plugins/: their tsconfigs and packages are the app's)
    defaults:
      run:
        working-directory: vaultite
    steps:
      - uses: actions/checkout@v4
        with:
          path: vaultite
      - uses: actions/checkout@v4
        with:
          repository: Vaultite/plugins
          path: vaultite-plugins
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: vaultite/package-lock.json
      - run: npm ci && ln -s ../vaultite/node_modules ../vaultite-plugins/node_modules
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vaultite/node_modules/playwright-core/package.json') }}
      - run: npx playwright-core install --with-deps chromium webkit
      # (tools/qa.ts builds the demo, then runs web/qa/demo.mjs on it)
      - run: npm run qa -- demo
  qa:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y tmux xvfb ffmpeg
      - run: npm run build
      - run: node tools/qa.ts --lint
      # The desktop scripts run Electron, which needs a display
      - run: xvfb-run -a npm run qa -- $SCRIPTS
        env:
          SCRIPTS: ${{ inputs.scripts }}
