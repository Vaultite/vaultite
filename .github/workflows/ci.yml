# Every push to main and pull request: build, check and the tests on Linux, macOS and Windows (windows.yml: Arm and the
# app itself), and the web demo. Nightly: every UI QA script too, so they don't rot (`-f scripts="a b"`: only those).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scripts:
        description: QA scripts to run (all when empty)
        required: false
  schedule:
    - cron: "17 5 * * *" # (off the hour: GitHub delays, and may drop, runs on it)
# A pull request's newer push cancels its older run; main's runs finish, the newest push waiting while one runs (GitHub
# drops the ones queued between), so main's head is always tested and a run's failure names its commit. The nightly and
# runs by hand (QA) queue apart, so a push never drops one.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || github.event_name == 'workflow_dispatch' && '-qa' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # (nothing here starts the desktop app: windows.yml and the nightly QA do)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # First: the rules most pushes break, in seconds
      - run: npm run check
      # Playwright's Chromium, cached by its version, so its CDN being down fails nothing (each step after check runs
      # whatever check said, so one push shows every failure)
      - if: ${{ !cancelled() }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: ./.github/actions/apt-cache
        with:
          name: test
      # (its system libraries only on Linux: on Windows Server --with-deps adds Media Foundation, minutes the tests never use)
      - if: ${{ !cancelled() }}
        run: npx playwright-core install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # (Linux's thumbnails are what's on PATH: core/thumbs.ts' converters, tested only where they're installed)
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: sudo apt-get install -y --no-install-recommends imagemagick poppler-utils ffmpeg
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: ./.github/actions/apt-cache
        with:
          name: test
          save: "true"
      - if: ${{ !cancelled() }}
        run: npm run build
      - if: ${{ !cancelled() }}
        run: npm test
      - if: ${{ !cancelled() }}
        run: npm run smoke
  # The web demo as the site builds it (Vaultite's own plugins at their main), in Chrome and WebKit: a demo that can't
  # start is caught on the push that broke it, not at a release.
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # (no desktop app here)
    # (the plugins beside the app, as vaultite/ and vaultite-plugins/: their tsconfigs and packages are the app's)
    defaults:
      run:
        working-directory: vaultite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vaultite
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Vaultite/plugins
          path: vaultite-plugins
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: vaultite/package-lock.json
      - run: npm ci && ln -s ../vaultite/node_modules ../vaultite-plugins/node_modules
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vaultite/node_modules/playwright-core/package.json') }}
      - uses: ./vaultite/.github/actions/apt-cache
        with:
          name: demo
      - run: npx playwright-core install --with-deps chromium webkit
      - uses: ./vaultite/.github/actions/apt-cache
        with:
          name: demo
          save: "true"
      # (tools/qa.ts builds the demo, then runs web/qa/demo.mjs on it)
      - run: npm run qa -- demo
  qa:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      # (WebKit: what only iOS's engine draws, in paneswipe and textselect)
      - uses: ./.github/actions/apt-cache
        with:
          name: qa
      - run: npx playwright-core install --with-deps chromium webkit
      - run: sudo apt-get install -y xvfb ffmpeg
      - uses: ./.github/actions/apt-cache
        with:
          name: qa
          save: "true"
      - run: npm run build
      - run: node tools/qa.ts --lint
      # The desktop scripts run Electron, which needs a display
      - run: xvfb-run -a npm run qa -- $SCRIPTS
        env:
          SCRIPTS: ${{ inputs.scripts }}
      # Soaks on a budget: what a short session leaves behind (the server's sockets and files, the page's heap and DOM)
      - if: ${{ !cancelled() && !inputs.scripts }}
        run: node tools/perf/serversoak.ts --minutes 12 --scale 10 --idle 3 --budget
      - if: ${{ !cancelled() && !inputs.scripts }}
        run: node tools/perf/soak.ts --minutes 10 --scale 3 --idle 1 --phases still,hidden --budget
