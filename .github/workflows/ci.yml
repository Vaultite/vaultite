# Every push to main and every pull request: build, check and the tests, on Linux and macOS. Nightly (and by hand):
# every UI QA script too, so they don't rot.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run smoke
  qa:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y tmux xvfb
      - run: npm run build
      - run: node tools/qa.ts --lint
      # The desktop scripts run Electron, which needs a display
      - run: xvfb-run -a npm run qa
