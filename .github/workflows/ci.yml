# Every push to main and pull request: build, check and the tests on Linux, macOS and Windows (windows.yml: Arm and the
# app itself), and the web demo. Nightly: every UI QA script too, so they don't rot (`-f scripts="a b"`: only those).
# A try/ branch (tools/try.ts: a change tried before it lands) runs the tests only, and never counts as main's; one
# marked -skip-<os> leaves that OS's out (a machine of the user's runs it), all three: none (windows.yml's surfaces only).
name: CI
on:
  push:
    branches: [main, "try/**", "!try/*-skip-linux-skip-macos-skip-windows*"]
  pull_request:
  workflow_dispatch:
    inputs:
      scripts:
        description: QA scripts to run (all when empty)
        required: false
  schedule:
    - cron: "17 5 * * *" # (off the hour: GitHub delays, and may drop, runs on it)
# A pull request's (or try branch's) newer push cancels its older run; main's runs finish, the newest push waiting while
# one runs (GitHub drops the ones queued between), so main's head is always tested and a run's failure names its commit.
# The nightly and runs by hand (QA) queue apart, so a push never drops one.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || github.event_name == 'workflow_dispatch' && '-qa' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/try/') }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
        exclude:
          - runner: ${{ contains(github.ref, '-skip-linux') && 'ubuntu-24.04' || 'none' }}
          - runner: ${{ contains(github.ref, '-skip-macos') && 'macos-15' || 'none' }}
          - runner: ${{ contains(github.ref, '-skip-windows') && 'windows-2025' || 'none' }}
    runs-on: ${{ matrix.runner }}
    # (a try's, tools/try.ts JOB_MIN: its bounds are said there)
    timeout-minutes: ${{ startsWith(github.ref, 'refs/heads/try/') && 15 || 45 }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # (nothing here starts the desktop app: windows.yml and the nightly QA do)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # First: the rules most pushes break, in seconds
      - run: npm run check
      # Playwright's Chromium, cached by its version, so its CDN being down fails nothing (each step after check runs
      # whatever check said, so one push shows every failure)
      - if: ${{ !cancelled() }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: ./.github/actions/apt-cache
        with:
          name: test
      # (its system libraries only on Linux: on Windows Server --with-deps adds Media Foundation, minutes the tests never use)
      - if: ${{ !cancelled() }}
        run: npx playwright-core install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # (Linux's thumbnails are what's on PATH: core/thumbs.ts' converters, tested only where they're installed)
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: sudo apt-get install -y --no-install-recommends imagemagick poppler-utils ffmpeg
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: ./.github/actions/apt-cache
        with:
          name: test
          save: "true"
      - if: ${{ !cancelled() }}
        run: npm run build
      - if: ${{ !cancelled() }}
        run: npm test
      - if: ${{ !cancelled() }}
        run: npm run smoke
  # The web demo as the site builds it (Vaultite's own plugins at their main), in Chrome and WebKit: a demo that can't
  # start is caught on the push that broke it, not at a release.
  # A change adds no more of a lint rule's patterns than its files had before it (tools/ratchet.ts): against the push's
  # previous tip on main, else a pull request's base (a try's is verify's: it runs the ratchet too).
  ratchet:
    if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/try/')) || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref == 'refs/heads/main' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: |
          if [ -n "$BASE" ] && [ "${BASE//0/}" != "" ]; then node tools/ratchet.ts --base "$BASE"
          else git fetch -q origin main && node tools/ratchet.ts; fi
  demo:
    if: ${{ !startsWith(github.ref, 'refs/heads/try/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # (no desktop app here)
    # (the plugins beside the app, as vaultite/ and vaultite-plugins/: their tsconfigs and packages are the app's)
    defaults:
      run:
        working-directory: vaultite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vaultite
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Vaultite/plugins
          path: vaultite-plugins
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: vaultite/package-lock.json
      - run: npm ci && ln -s ../vaultite/node_modules ../vaultite-plugins/node_modules
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vaultite/node_modules/playwright-core/package.json') }}
      - uses: ./vaultite/.github/actions/apt-cache
        with:
          name: demo
      - run: npx playwright-core install --with-deps chromium webkit
      - uses: ./vaultite/.github/actions/apt-cache
        with:
          name: demo
          save: "true"
      # (tools/qa.ts builds the demo, then runs web/qa/demo.mjs on it)
      - run: npm run qa -- demo
  qa:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      # (WebKit: what only iOS's engine draws, in paneswipe and textselect)
      - uses: ./.github/actions/apt-cache
        with:
          name: qa
      - run: npx playwright-core install --with-deps chromium webkit
      - run: sudo apt-get install -y xvfb ffmpeg
      - uses: ./.github/actions/apt-cache
        with:
          name: qa
          save: "true"
      - run: npm run build
      - run: node tools/qa.ts --lint
      # The desktop scripts run Electron, which needs a display
      - run: xvfb-run -a npm run qa -- $SCRIPTS
        env:
          SCRIPTS: ${{ inputs.scripts }}
      # Soaks on a budget: what a short session leaves behind (the server's sockets and files, the page's heap and DOM)
      - if: ${{ !cancelled() && !inputs.scripts }}
        run: node tools/perf/serversoak.ts --minutes 12 --scale 10 --idle 3 --budget
      - if: ${{ !cancelled() && !inputs.scripts }}
        run: node tools/perf/soak.ts --minutes 10 --scale 3 --idle 1 --phases still,hidden --budget
  # Transfer impact (tools/perf/transfer.ts): what reference flows move over an emulated phone network, this commit
  # against its base (the push's previous main, a pull request's merge base) taking turns on one runner; the table in
  # the run's summary, and on a pull request as one comment (transfer-report.yml). Fails on a metric over its ceiling
  # (tools/perf/transfer.json).
  transfer:
    if: ${{ !startsWith(github.ref, 'refs/heads/try/') && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - uses: ./.github/actions/apt-cache
        with:
          name: transfer
      - run: npx playwright-core install --with-deps chromium
      - uses: ./.github/actions/apt-cache
        with:
          name: transfer
          save: "true"
      # (the base built beside this checkout; its own packages only when its lockfile differs)
      - id: base
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=$(git merge-base "$BEFORE" HEAD 2>/dev/null || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then echo "none"; exit 0; fi
          git worktree add --detach ../base "$base"
          if cmp -s package-lock.json ../base/package-lock.json; then ln -s "$PWD/node_modules" ../base/node_modules; else (cd ../base && npm ci); fi
          (cd ../base && node node_modules/vite/bin/vite.js build --logLevel warn)
          echo "root=--root ../base --from ../base" >> "$GITHUB_OUTPUT"
      - run: node node_modules/vite/bin/vite.js build --logLevel warn
      - run: node tools/perf/transfer.ts ${{ steps.base.outputs.root }} --root . --runs 2 --profiles cellular --idle 30 --out transfer.json
      - run: |
          set +e
          node tools/perf/transfer_report.ts transfer.json --out transfer.md --repo "${{ github.repository }}" --check; status=$?
          cat transfer.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # (for the pull request's comment: transfer-report.yml reads it as data, from main's code)
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transfer
          path: transfer.json
          if-no-files-found: ignore
          retention-days: 30
