# CI's transfer table (ci.yml's transfer job) on its pull request, as one comment kept up to date. It runs from main
# (workflow_run, whose token can write even for a fork's pull request), never the pull request's code: the pull request's
# artifact is read as data by main's tools/perf/transfer_report.ts, which checks every value before any reaches the comment.
name: Transfer report
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: transfer-report-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/perf/transfer_report.ts
            tools/perf/transfer.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/transfer"
          if ! gh run download "$RUN" -R "$REPO" -n transfer -D "$dir"; then echo "no transfer result in run $RUN"; exit 0; fi
          [ -f "$dir/transfer.json" ] || { echo "no transfer.json"; exit 0; }
          # (a fork's pull request isn't named by its run: found by its head commit)
          pr="${PR:-}"
          if [ -z "$pr" ]; then pr=$(gh api "search/issues?q=repo:$REPO+is:pr+$SHA" --jq '.items[0].number // empty'); fi
          [ -n "$pr" ] || { echo "no pull request for $SHA"; exit 0; }
          node tools/perf/transfer_report.ts "$dir/transfer.json" --ceilings tools/perf/transfer.json --out body.md --repo "$REPO" --ci "$CONCLUSION"
          printf '\n<sub>Updated in place by a workflow from main: the pull request'"'"'s result is read as data and checked, never run.</sub>\n<!-- vaultite-transfer-report -->\n' >> body.md
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- vaultite-transfer-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null; fi
