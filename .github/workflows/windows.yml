# What only a real Windows shows (vau from each shell, the service, terminals, the installer) and the tests on Arm. Each
# script in .github/windows/ writes what it saw to windows-out/, kept with the run.
name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# As ci.yml: only a pull request's older run is cancelled, so main's Windows runs finish rather than each next push
# cancelling the last (a 13-minute run under a busy main was rarely finished).
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: ${{ !cancelled() }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - if: ${{ !cancelled() }}
        run: npx playwright-core install chromium
      - if: ${{ !cancelled() }}
        run: npm run build
      - if: ${{ !cancelled() }}
        run: npm test
      - if: ${{ !cancelled() }}
        run: npm run smoke
  surfaces:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      # (the app's packaging scripts set variables sh's way: Git Bash runs npm's scripts here)
      - run: npm config set script-shell "$(cygpath -w "$(command -v bash)")"
      - run: npm ci
      # (WSL with a distro, for vau and the terminals there; skipped where the runner can't have one)
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        continue-on-error: true
        with:
          distribution: Ubuntu-24.04
      - run: npm run build
      - if: ${{ !cancelled() }}
        name: vau from every shell, Set up's PATH, opening files, the service, WSL
        run: bash .github/windows/cli.sh
      - if: ${{ !cancelled() && hashFiles('.github/windows/terminal.sh') != '' }}
        name: The terminals and coding agents
        run: bash .github/windows/terminal.sh
      - if: ${{ !cancelled() && hashFiles('.github/windows/app.sh') != '' }}
        name: The installer, installed, launched and uninstalled
        run: bash .github/windows/app.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: windows-out/
          if-no-files-found: ignore
