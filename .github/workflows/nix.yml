# The flake's packages (the server with vau, and the desktop app), built as `nix build` does, when what they pin changes,
# and nightly. Nothing is cached between runs: npm's packages are fetched again each time, so a stale npmDepsHash always
# fails here, saying the new one (a kept copy of the old packages would only say they differ).
name: Nix
on:
  push:
    branches: [main]
    paths: &paths [package-lock.json, flake.nix, flake.lock, .github/workflows/nix.yml]
  pull_request: # (outside contributors' only, by the job's if, as ci.yml's)
    paths: *paths
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *" # (ci.yml's nightly)
concurrency:
  group: nix-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: nix build .#server
        run: |
          set -o pipefail
          nix build -L --no-link .#server 2>&1 | tee "$RUNNER_TEMP/nix.log" && exit 0
          got=$(grep -A 3 'hash mismatch.*npm-deps\.drv' "$RUNNER_TEMP/nix.log" | sed -n 's/.*got: *\(sha256-[^ ]*\).*/\1/p')
          [ -z "$got" ] || echo "::error file=flake.nix,title=Stale npmDepsHash::package-lock.json changed: set npmDepsHash in flake.nix to $got"
          exit 1
      - name: nix build
        run: nix build -L --no-link
